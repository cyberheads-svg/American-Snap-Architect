<!DOCTYPE html>
<html lang="ja" style="background:#0c0b0e">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>American Snap Architect</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400&display=swap');
  :root{
    --bg:#0c0b0e;--panel:#131118;--border:#22202a;--border2:#332f40;
    --text:#d4cee0;--muted:#6a6278;--dim:#2a2535;
    --spring:#f9a8d4;--summer:#86efac;--autumn:#fcd34d;--winter:#93c5fd;
    --accent:#c084fc;--mono:'DM Mono',monospace;--serif:'DM Serif Display',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#0c0b0e}
  body{background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px 60px}
  header{text-align:center;margin-bottom:32px}
  .eyebrow{font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  h1{font-family:var(--serif);font-style:italic;font-size:clamp(28px,5vw,46px);color:#fff;font-weight:400;line-height:1.1;margin-bottom:4px}
  h1 span{color:var(--spring)}
  .subtitle{font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.15em}
  .counter{font-size:10px;color:var(--dim);margin-top:8px;letter-spacing:.2em}
  .selector-group{width:100%;max-width:680px;margin-bottom:12px}
  .selector-label{font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .selector{display:flex;gap:8px;width:100%}
  .selector-btn{flex:1;padding:11px 0;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:all .2s}
  .selector-btn:hover{border-color:var(--border2);color:var(--text)}
  .selector-btn.active-spring{border-color:var(--spring);color:var(--spring);background:#1a0f14}
  .selector-btn.active-summer{border-color:var(--summer);color:var(--summer);background:#0f1a12}
  .selector-btn.active-autumn{border-color:var(--autumn);color:var(--autumn);background:#1a1710}
  .selector-btn.active-winter{border-color:var(--winter);color:var(--winter);background:#0f1218}
  .frame-btn.active{border-color:var(--accent);color:var(--accent);background:#16101a}
  .card{width:100%;max-width:680px;background:var(--panel);border:1px solid var(--border);padding:32px;margin-bottom:20px}
  .empty-state{text-align:center;padding:40px 0;color:var(--dim);font-size:12px;letter-spacing:.05em;line-height:1.7}
  .fields{display:flex;flex-direction:column;gap:0}
  .field{display:grid;grid-template-columns:110px 1fr;gap:15px;align-items:start;padding:12px 0;border-bottom:1px solid var(--border)}
  .field:last-child{border-bottom:none}
  .field-label{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);padding-top:4px}
  .field-value{font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.4}
  .rare-badge{font-family:var(--mono);font-size:8px;letter-spacing:.15em;text-transform:uppercase;padding:1px 6px;border:1px solid currentColor;opacity:.6;margin-left:8px;vertical-align:middle;font-style:normal}
  .divider{border:none;border-top:1px solid var(--border);margin:20px 0}
  .prompt-label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .prompt-text{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.9;margin-bottom:14px;word-break:break-word}
  .copy-btn{background:transparent;border:1px solid var(--border2);color:var(--muted);padding:8px 20px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;font-family:var(--mono);transition:all .2s}
  .copy-btn:hover{border-color:var(--accent);color:var(--accent)}
  .copy-btn.copied{border-color:var(--summer);color:var(--summer)}
  .generate-btn{width:100%;max-width:680px;background:var(--accent);color:#000;font-weight:700;border:none;padding:20px;font-size:12px;letter-spacing:.4em;text-transform:uppercase;cursor:pointer;font-family:var(--mono);transition:all .2s;margin-bottom:12px}
  .generate-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
  .generate-btn:active{transform:translateY(0)}
  .save-btn{width:100%;max-width:680px;background:transparent;border:1px solid var(--border);color:var(--muted);padding:12px;font-size:10px;letter-spacing:.25em;text-transform:uppercase;cursor:pointer;font-family:var(--mono);transition:all .2s;margin-bottom:40px}
  .save-btn:hover{border-color:var(--border2);color:var(--text)}
  .saved-section{width:100%;max-width:680px}
  .saved-title{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border)}
  .saved-item{background:var(--panel);border:1px solid var(--border);padding:12px 16px;margin-bottom:8px;font-size:11px;color:var(--muted);line-height:1.7;cursor:pointer;transition:border-color .15s}
  .saved-item:hover{border-color:var(--border2);color:var(--text)}
  footer{margin-top:20px;font-size:9px;color:var(--dim);letter-spacing:.2em;text-align:center}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .animate-in{animation:fadeIn .3s ease forwards}
  .reroll-btn{background:transparent;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:2px 6px;line-height:1;transition:color .15s;flex-shrink:0}
  .reroll-btn:hover{color:var(--accent)}
  .field-row{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--border)}
  .field-row:last-child{border-bottom:none}
  .prompt-textarea{width:100%;background:#0a0808;border:1px solid var(--border2);color:var(--muted);font-family:var(--mono);font-size:11px;line-height:1.9;padding:12px;resize:vertical;min-height:120px;margin-bottom:14px;word-break:break-word}
  .prompt-textarea:focus{outline:none;border-color:var(--accent)}
</style>
</head>
<body>

<header>
  <div class="eyebrow">AI Prompt Suite</div>
  <h1>American Snap <span>Architect</span></h1>
  <div class="subtitle">Outfit · Scene · Figure · Definitive Edition</div>
  <div class="counter" id="counter">— generated</div>
</header>

<div class="selector-group">
  <div class="selector-label">Season</div>
  <div class="selector">
    <button class="selector-btn active-spring" data-season="spring" onclick="setSeason('spring')">🌸 Spring</button>
    <button class="selector-btn" data-season="summer" onclick="setSeason('summer')">☀️ Summer</button>
    <button class="selector-btn" data-season="autumn" onclick="setSeason('autumn')">🍂 Autumn</button>
    <button class="selector-btn" data-season="winter" onclick="setSeason('winter')">❄️ Winter</button>
  </div>
</div>

<div class="selector-group">
  <div class="selector-label">Framing</div>
  <div class="selector">
    <button class="selector-btn frame-btn active" onclick="setFraming('full')" id="frame-full">Full Body</button>
    <button class="selector-btn frame-btn" onclick="setFraming('upper')" id="frame-upper">Upper Body</button>
    <button class="selector-btn frame-btn" onclick="setFraming('bust')" id="frame-bust">Bust Up</button>
    <button class="selector-btn frame-btn" onclick="setFraming('close')" id="frame-close">Face Close-up</button>
  </div>
</div>

<div class="card">
  <div class="empty-state" id="emptyState">
    <div style="font-size:32px;margin-bottom:12px;opacity:.4">✦</div>
    Season と Framing を選んでボタンを押してください<br>衣装・シーン・人物が一度に生成されます
  </div>
  <div id="displayFields" class="fields animate-in" style="display:none"></div>
  <div id="promptBox" style="display:none">
    <hr class="divider">
    <div class="prompt-label">画像AIにコピー</div>
    <textarea class="prompt-textarea" id="finalPrompt" onInput="currentPrompt=this.value"></textarea>
    <button class="copy-btn" id="copyBtn" onclick="copyPrompt()">Copy Prompt</button>
  </div>
</div>

<button class="generate-btn" onclick="generateAll()">GENERATE ARCHITECT</button>
<button class="save-btn" onclick="savePrompt()" id="saveBtn" style="display:none">SAVE THIS PROMPT</button>

<div class="saved-section" id="savedSection" style="display:none">
  <div class="saved-title">Saved Prompts</div>
  <div id="savedList"></div>
</div>

<footer>1000+ DATA POINTS · MILLIONS OF COMBINATIONS · GitHub Pages Ready</footer>

// Accessory picker with location-aware filtering (Gemini proposal #1)
function pickAccessories(loc = "") {
  const isFilmSet = /film set|sound stage|actor.*trailer|craft services|makeup trailer|costume department|editing suite|sound mixing|location scout/.test(loc);
  const isCultural = /navajo|hawaii|alaska|arctic|powwow|inupiat|yupik|native hawaiian/.test(loc);
  const isBiker = /motorcycle|bike|harley|biker|cafe racer|road warrior/.test(loc);
  const isWedding = /wedding|bride|bridesmaid/.test(loc);
  const isPromOrHomecoming = /prom|homecoming/.test(loc);

  // Category definitions
  const bagItems = ACCESSORIES.filter(a => a.includes("bag") || a.includes("tote") || a.includes("clutch") || a.includes("backpack") || a.includes("saddlebag") || a.includes("tank bag") || a.includes("roll bag"));
  const hatItems = ACCESSORIES.filter(a => a.includes("hat") || a.includes("beanie") || a.includes("beret") || a.includes("cap") || a.includes("bucket") || a.includes("fascinator") || a.includes("crown") || a.includes("headband") || a.includes("scrunchie") || a.includes("clip") || a.includes("ribbon") || a.includes("braided headband") || a.includes("floral hair crown"));
  const neckItems = ACCESSORIES.filter(a => a.includes("scarf") || a.includes("muffler") || a.includes("choker") || a.includes("necklace") || a.includes("pendant") || a.includes("lariat") || a.includes("bandana") || a.includes("do-rag") || a.includes("collar") || a.includes("body chain"));
  const wristItems = ACCESSORIES.filter(a => a.includes("bracelet") || a.includes("bangle") || a.includes("cuff") || a.includes("wrist") || a.includes("garter"));
  const fingerItems = ACCESSORIES.filter(a => a.includes("ring") || a.includes("knuckle"));
  const eyewearItems = ACCESSORIES.filter(a => a.includes("glasses") || a.includes("frames") || a.includes("sunglasses") || a.includes("shades"));
  const sunglassesItems = ACCESSORIES.filter(a => a.includes("sunglasses") || a.includes("shades"));
  const regularGlassesItems = ACCESSORIES.filter(a => (a.includes("glasses") || a.includes("frames")) && !a.includes("sunglasses") && !a.includes("shades"));

  // Context-specific items to exclude in normal scenes
  const filmSetAccessories = ["clapperboard with scene number","megaphone for crowd scenes","boom mic held above head","light meter hanging from neck","thick script binder with colored tabs","coffee cup with film crew logo","folding director's chair with name","slate with dry-erase marker","film camera viewfinder hanging from neck","headset with mic","multi-tool Leatherman","tape measure","flashlight for night shoots","earplugs for loud scenes","walkie-talkie clipped to belt","walkie-talkie earpiece","film loader changing bag","continuity photo album Polaroids","stopwatch 1st AD timing takes"];
  const culturalAccessories = ["turquoise jewelry","native american beadwork","lei","hula skirt","snowmobile helmet","polar parka","mukluks"];
  const bikerAccessories = ["chain wallet","fingerless leather gloves","riding gloves","studded belt","biker rings"];
  const weddingAccessories = ["bridal bouquet","bridesmaid bouquet","boutonniere","prom corsage","wrist corsage"];
  const eventAccessories = ["tiara","prom queen sash","homecoming queen sash"];

  // Build filtered pool based on context
  let pool = [...ACCESSORIES];

  if (!isFilmSet) {
    pool = pool.filter(a => !filmSetAccessories.includes(a));
  }
  if (!isCultural) {
    pool = pool.filter(a => !culturalAccessories.includes(a));
  }
  if (!isBiker) {
    pool = pool.filter(a => !bikerAccessories.includes(a));
  }
  if (!isWedding) {
    pool = pool.filter(a => !weddingAccessories.includes(a));
  }
  if (!isPromOrHomecoming) {
    pool = pool.filter(a => !eventAccessories.includes(a));
  }

  // Rebuild category lists from filtered pool
  const filteredBags = pool.filter(a => bagItems.includes(a));
  const filteredHats = pool.filter(a => hatItems.includes(a));
  const filteredNecks = pool.filter(a => neckItems.includes(a));
  const filteredWrists = pool.filter(a => wristItems.includes(a));
  const filteredFingers = pool.filter(a => fingerItems.includes(a));
  const filteredEyewear = pool.filter(a => eyewearItems.includes(a));
  const filteredSunglasses = pool.filter(a => sunglassesItems.includes(a));
  const filteredRegularGlasses = pool.filter(a => regularGlassesItems.includes(a));
  const filteredOthers = pool.filter(a => 
    !bagItems.includes(a) && !hatItems.includes(a) && !neckItems.includes(a) && 
    !wristItems.includes(a) && !fingerItems.includes(a) && !eyewearItems.includes(a)
  );

  let selected = [];
  let hasBag = false;
  let hasHat = false;
  let hasNeck = false;
  let hasWrist = false;
  let hasFinger = false;
  let hasEyewear = false;

  const count = Math.random() < 0.5 ? 2 : 3;

  for (let i = 0; i < count; i++) {
    let currentPool = filteredOthers;
    
    if (!hasBag && filteredBags.length > 0 && Math.random() < 0.6) currentPool = [...currentPool, ...filteredBags];
    if (!hasHat && filteredHats.length > 0 && Math.random() < 0.5) currentPool = [...currentPool, ...filteredHats];
    if (!hasNeck && filteredNecks.length > 0 && Math.random() < 0.4) currentPool = [...currentPool, ...filteredNecks];
    if (!hasWrist && filteredWrists.length > 0 && Math.random() < 0.35) currentPool = [...currentPool, ...filteredWrists];
    if (!hasFinger && filteredFingers.length > 0 && Math.random() < 0.3) currentPool = [...currentPool, ...filteredFingers];
    
    if (!hasEyewear && filteredEyewear.length > 0 && Math.random() < 0.3) {
      if (filteredRegularGlasses.length > 0 && Math.random() < 0.65) {
        currentPool = [...currentPool, ...filteredRegularGlasses];
      } else if (filteredSunglasses.length > 0) {
        currentPool = [...currentPool, ...filteredSunglasses];
      }
    }

    if (currentPool.length === 0) break;

    const item = pick(currentPool);
    selected.push(item);
    currentPool = currentPool.filter(i => i !== item);

    if (filteredBags.includes(item)) hasBag = true;
    if (filteredHats.includes(item)) hasHat = true;
    if (filteredNecks.includes(item)) hasNeck = true;
    if (filteredWrists.includes(item)) hasWrist = true;
    if (filteredFingers.includes(item)) hasFinger = true;
    if (filteredEyewear.includes(item)) hasEyewear = true;
  }

  return selected.join(", ");
}

// New: Season and TPO-aware bottom correction (Gemini proposal #3)
function getContextualBottom(season, loc) {
  const isWinter = season === "winter";
  const isFormal = /wedding|prom|homecoming|ballroom|opera|formal|church/.test(loc);
  const isBeach = /beach|ocean|sand|hawaii/.test(loc);
  const isBiker = /motorcycle|bike|harley|biker/.test(loc);

  let pool = [...BOTTOMS];

  // Winter: reduce extremely revealing bottoms
  if (isWinter) {
    const revealingBottoms = pool.filter(b => 
      b.includes("micro") || b.includes("ultra-short") || b.includes("bodycon mini") || 
      b.includes("high-slit") || b.includes("thong") || b.includes("barely-there")
    );
    if (revealingBottoms.length > 0 && Math.random() < 0.7) {
      pool = pool.filter(b => !revealingBottoms.includes(b));
    }
  }

  // Formal locations: reduce casual bottoms
  if (isFormal) {
    const casualBottoms = pool.filter(b => 
      b.includes("sweat") || b.includes("jogger") || b.includes("cargo") || 
      b.includes("track") || b.includes("yoga") || b.includes("athletic") ||
      b.includes("denim shorts") || b.includes("micro denim")
    );
    if (casualBottoms.length > 0 && Math.random() < 0.8) {
      pool = pool.filter(b => !casualBottoms.includes(b));
    }
  }

  // Beach: boost light/summer bottoms
  if (isBeach) {
    const beachBottoms = pool.filter(b => 
      b.includes("shorts") || b.includes("skirt") || b.includes("sarong") || 
      b.includes("pareo") || b.includes("wrap") || b.includes("thong") ||
      b.includes("high-slit")
    );
    if (beachBottoms.length > 0 && Math.random() < 0.6) {
      pool = [...pool, ...beachBottoms]; // increase chance
    }
  }

  // Biker: boost leather/denim
  if (isBiker) {
    const bikerBottoms = pool.filter(b => 
      b.includes("leather") || b.includes("denim") || b.includes("moto") || 
      b.includes("riding") || b.includes("distressed")
    );
    if (bikerBottoms.length > 0 && Math.random() < 0.5) {
      pool = [...pool, ...bikerBottoms];
    }
  }

  return pick(pool);
}

  const eventSpecificStyles = ["tiara","graduation cap tassel","letterman jacket patches","sorority pin","frat pin"];

  // Slightly boost normal styles in everyday locations
  if (isEveryday && !filmCrewStyles.includes(style) && !culturalStyles.includes(style) && !eventSashStyles.includes(style) && !weddingStyles.includes(style) && !bikerStyles.includes(style) && !filmSetAccessories.includes(style) && !eventSpecificStyles.includes(style)) {
    return 1.3;
  }
  
  // Reduce film crew in everyday locations (but not too harshly)
  if (isEveryday && filmCrewStyles.includes(style)) {
    return 0.35;
  }
  
  // Reduce cultural styles outside cultural locations
  if (!isCultural && culturalStyles.includes(style)) {
    return 0.4;
  }
  
  // Event sashes (prom/homecoming) should only appear in prom/homecoming locations
  if (!isPromOrHomecoming && eventSashStyles.includes(style)) {
    return 0.1;
  }
  
  // Wedding items should only appear in wedding locations
  if (!isWedding && weddingStyles.includes(style)) {
    return 0.1;
  }
  
  // Biker items should only appear in biker locations
  if (!isBiker && bikerStyles.includes(style)) {
    return 0.2;
  }
  
  // Film set accessories should only appear in film set locations
  if (!isFilmSet && filmSetAccessories.includes(style)) {
    return 0.1;
  }
  
  // Event-specific items (tiara, graduation, letterman, Greek life)
  if (!isPromOrHomecoming && !isWedding && !isGraduation && !isGreekLife && eventSpecificStyles.includes(style)) {
    return 0.15;
  }
  
  // Mild boost for film crew in film set locations
  if (isFilmSet && filmCrewStyles.includes(style)) {
    return 1.6;
  }
  
  // Mild boost for cultural styles in cultural locations
  if (isCultural && culturalStyles.includes(style)) {
    return 1.5;
  }
  
  // Mild boost for biker styles in biker locations
  if (isBiker && bikerStyles.includes(style)) {
    return 1.8;
  }
  
  // Mild boost for film set accessories in film set locations
  if (isFilmSet && filmSetAccessories.includes(style)) {
    return 2.0;
  }
  
  return 1.0;
}

// 1. Temporal Lighting Sync - Time-based lighting filter
function getTemporalLighting(time) {
  const isNight = /night|midnight|3am|sodium|streetlight/.test(time);
  const isGoldenHour = /golden hour|sunset|sunrise|dusk|dawn/.test(time);
  const isOvercast = /overcast|cloudy|flat|grey/.test(time);
  const isWinter = /winter|cold|snow/.test(time);

  let pool = [...LIGHTING];

  if (isNight) {
    // Night: neon, streetlights, headlights, indoor lights only
    const nightLighting = pool.filter(l => 
      l.includes("neon") || l.includes("street lamp") || l.includes("headlight") || 
      l.includes("indoor") || l.includes("lamp") || l.includes("bulb") || 
      l.includes("fluorescent") || l.includes("sodium") || l.includes("moonlight")
    );
    if (nightLighting.length > 0) pool = nightLighting;
  } else if (isGoldenHour) {
    // Golden hour: side light, rim light, backlight
    const goldenLighting = pool.filter(l => 
      l.includes("golden") || l.includes("side") || l.includes("rim") || 
      l.includes("backlight") || l.includes("warm") || l.includes("sunset") || 
      l.includes("sunrise") || l.includes("dawn") || l.includes("dusk")
    );
    if (goldenLighting.length > 0) pool = goldenLighting;
  } else if (isOvercast || isWinter) {
    // Overcast/Winter: flat, soft, diffused light
    const softLighting = pool.filter(l => 
      l.includes("overcast") || l.includes("diffused") || l.includes("soft") || 
      l.includes("flat") || l.includes("even") || l.includes("pale") || 
      l.includes("thin") || l.includes("cloud")
    );
    if (softLighting.length > 0) pool = softLighting;
  }

  return pool.length > 0 ? pick(pool) : pick(LIGHTING);
}

// 2. Optical Integrity Logic - Framing-aware camera selection
function getOpticalCamera(framing) {
  let pool = [...CAMERA];

  if (framing === "close") {
    // Close-up: prefer portrait lenses (85mm, macro)
    const closeupCameras = pool.filter(c => 
      c.includes("85mm") || c.includes("portrait") || c.includes("macro") || 
      c.includes("close-up") || c.includes("intimate") || c.includes("shallow depth")
    );
    if (closeupCameras.length > 0 && Math.random() < 0.7) {
      pool = [...pool, ...closeupCameras, ...closeupCameras]; // boost
    }
  } else if (framing === "full") {
    // Full body: prefer wide angle (24mm) or telephoto (200mm)
    const fullbodyCameras = pool.filter(c => 
      c.includes("24mm") || c.includes("wide") || c.includes("200mm") || 
      c.includes("telephoto") || c.includes("compressed") || c.includes("bird's eye")
    );
    if (fullbodyCameras.length > 0 && Math.random() < 0.6) {
      pool = [...pool, ...fullbodyCameras];
    }
  } else if (framing === "bust") {
    // Bust shot: balanced, natural perspective (50mm)
    const bustCameras = pool.filter(c => 
      c.includes("50mm") || c.includes("natural perspective") || c.includes("mid-distance")
    );
    if (bustCameras.length > 0 && Math.random() < 0.5) {
      pool = [...pool, ...bustCameras];
    }
  }

  return pick(pool);
}

// 3. Environment Boundary - Indoor/Outdoor detection
function isIndoorLocation(loc) {
  return /interior|inside|room|cafe|diner|pub|bar|library|bookstore|workshop|studio|church|chapel|ballroom|theatre|cinema|museum|gallery|shop|store|office|bedroom|kitchen|bathroom|hallway|corridor|basement|attic|garage|warehouse|factory|gym|school|university|dorm|frat|sorority/.test(loc);
}

function getEnvironmentalWeather(loc, weather) {
  const isIndoor = isIndoorLocation(loc);
  
  if (isIndoor) {
    // Indoor: convert weather to light/atmosphere description
    if (weather.includes("rain")) return "soft rain visible through window, gentle light";
    if (weather.includes("snow")) return "snow falling outside window, cozy indoor warmth";
    if (weather.includes("wind")) return "wind visible through window, curtains moving slightly";
    if (weather.includes("storm")) return "distant thunder, dim indoor lighting";
    if (weather.includes("sun")) return "bright sunlight streaming through window";
    return "soft indoor ambient light, window view in background";
  }
  
  return weather; // Outdoor: keep original weather
}

// 4. Negative Constraint Enforcement - Hard validation rules
function hasNegativeConstraint(season, loc, bottom, outer) {
  const isSummer = season === "summer";
  const isWinter = season === "winter";
  const isFormal = /wedding|prom|homecoming|ballroom|opera|formal|church/.test(loc);
  const isBeach = /beach|ocean|sand|hawaii/.test(loc);

  // Summer + heavy winter clothing
  if (isSummer && outer && (outer.includes("wool") || outer.includes("puffer") || outer.includes("shearling") || outer.includes("fur"))) {
    return true;
  }

  // Winter + swimwear/revealing
  if (isWinter && bottom && (bottom.includes("swim") || bottom.includes("bikini") || bottom.includes("shorts") || bottom.includes("micro"))) {
    return true;
  }

  // Formal + heavy distressed/casual
  if (isFormal && bottom && (bottom.includes("distressed") || bottom.includes("ripped") || bottom.includes("cargo") || bottom.includes("sweat"))) {
    return true;
  }

  // Beach + heavy winter clothing
  if (isBeach && outer && (outer.includes("wool") || outer.includes("puffer") || outer.includes("coat"))) {
    return true;
  }

  return false;
}

// 5. Emotional Tone Deepening - Theme to film style linking
function getThemedStyleScene(theme, styleScene) {
  const nostalgicThemes = ["nostalgic", "bittersweet", "memory", "half-remembered", "golden light"];
  const rawThemes = ["raw and real", "no performance", "just life", "unflinching", "gritty"];
  const dreamyThemes = ["dreamy", "soft", "ethereal", "hazy", "floating"];
  const tenseThemes = ["tense", "charged", "something about to happen", "uneasy"];

  let pool = [styleScene];

  if (nostalgicThemes.some(t => theme.includes(t))) {
    // Nostalgic: Portra, Super 8, warm faded
    const nostalgicStyles = ["Kodak Portra 400 film aesthetic, warm and slightly faded", "Super 8 film aesthetic, warm grain and vignette", "35mm film grain, saturated American colours"];
    pool = [...pool, ...nostalgicStyles];
  } else if (rawThemes.some(t => theme.includes(t))) {
    // Raw/Real: deadpan, 35mm grain, unflinching
    const rawStyles = ["gritty street photography, unflinching and real", "35mm film grain, saturated American colours", "William Eggleston colour photography, banal and beautiful"];
    pool = [...pool, ...rawStyles];
  } else if (dreamyThemes.some(t => theme.includes(t))) {
    // Dreamy: soft focus, hazy
    const dreamyStyles = ["soft focus dreamlike quality, hazy edges", "Sofia Coppola dreamy soft focus, intimate and floating"];
    pool = [...pool, ...dreamyStyles];
  } else if (tenseThemes.some(t => theme.includes(t))) {
    // Tense: high contrast, dramatic
    const tenseStyles = ["bleach bypass processing, desaturated with contrast", "David Lynch wide angle uncanny stillness, something wrong you cannot name"];
    pool = [...pool, ...tenseStyles];
  }

  return pick(pool);
}

// New: Unified emotional narrative (combines theme + mood + core + variation into one cohesive sentence)
function buildEmotionalNarrative(theme, mood, variation) {
  const base = `${theme}, ${mood}`;
  const variationPart = variation ? ` ${variation}` : "";
  
  // Create natural flowing sentences
  const narratives = [
    `${base}${variationPart}`,
    `this feels like ${base}${variationPart}`,
    `a moment that captures ${base}${variationPart}`,
    `the kind of ${base} that stays with you${variationPart}`
  ];
  
  return pick(narratives);
}

function setSeason(s) {
  currentSeason = s;
  document.querySelectorAll(".selector-btn[data-season]").forEach(b => {
    b.className = "selector-btn";
    if (b.dataset.season === s) b.classList.add("active-" + s);
  });
}

function setFraming(f) {
  currentFraming = f;
  document.querySelectorAll(".frame-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("frame-" + f).classList.add("active");
}

let lastVals = {};

function reroll(key) {
  const sources = {
    style: STYLES, bottom: BOTTOMS, fabric: FABRICS,
    shoe: SHOES, loc: LOCATIONS, time: TIMES, mood: MOODS,
    camera: CAMERA, styleScene: STYLE_SCENE, pose: BODY_POSES,
    gesture: HAND_GESTURES, expression: FACIAL_EXPRESSIONS, light: LIGHTING,
  };
  
  if (sources[key]) {
    lastVals[key] = pick(sources[key]);
  } else if (key === 'top') {
    const isFormalLocation = lastVals.loc && FORMAL_LOC_KEYWORDS.some(k => lastVals.loc.includes(k));
    if (isFormalLocation && Math.random() < 0.7) {
      lastVals.top = pick(FORMAL_TOPS);
    } else if (Math.random() < 0.25) {
      lastVals.top = pick(SEXY_TOPS);
    } else {
      lastVals.top = pick(TOPS);
    }
  } else if (key === 'color') {
    lastVals.color = pick(COLORS[currentSeason]);
  } else if (key === 'weather') {
    lastVals.weather = pick(WEATHER[currentSeason]);
  } else if (key === 'season_scene') {
    lastVals.season_scene = pick(SEASONS_SCENE[currentSeason]);
  } else if (key === 'bottom') {
    lastVals.bottom = getContextualBottom(currentSeason, lastVals.loc);
  } else if (key === 'acc') {
    lastVals.acc = pickAccessories(lastVals.loc);
  } else if (key === 'outer') {
    if (currentSeason === "summer") {
      lastVals.outer = Math.random() < 0.25 ? pick(OUTERWEAR.summer) : null;
    } else {
      lastVals.outer = Math.random() < 0.55 ? pick(OUTERWEAR[currentSeason]) : null;
    }
  } else if (key === 'perception') {
    lastVals.perception = Math.random() < 0.55 ? pick(PERCEPTION) : null;
  } else if (key === 'theme' || key === 'mood') {
    if (key === 'theme') lastVals.theme = pick(THEMES);
    if (key === 'mood') lastVals.mood = pick(MOODS);
    lastVals.variation = Math.random() < 0.5 ? pick(CORE_VARIATION) : null;
    lastVals.emotionalNarrative = buildEmotionalNarrative(lastVals.theme, lastVals.mood, lastVals.variation);
  } else if (key === 'noise') {
    lastVals.noise = Math.random() < 0.65 ? getContextualNoise(lastVals.loc) : null;
  } else if (key === 'emotionalNarrative') {
    lastVals.emotionalNarrative = buildEmotionalNarrative(lastVals.theme, lastVals.mood, lastVals.variation);
  }
  rebuildPromptAndDisplay();
}

function rebuildPromptAndDisplay() {
  const v = lastVals;
  const framingText = { full: "full body shot", upper: "upper body shot from waist up", bust: "bust shot", close: "extreme close-up on face" }[currentFraming];
  const parts = [
    // SUBJECT
    "subject: young American woman in her early 20s, naturally styled, no heavy makeup",
    `framing: ${framingText}`,
    `pose: ${v.pose}`,
    `gesture: ${v.gesture}`,
    `expression: ${v.expression}`,
    `lighting: ${v.light}`,

    // LOOK
    `outfit style: ${v.style}`,
    `top: ${v.top}`,
    `bottom: ${v.bottom}`,
    ...(v.outer ? [`outer: ${v.outer}`] : []),
    `fabric: ${v.fabric}`,
    `color palette: ${v.color}`,
    `accessories: ${v.acc}`,
    `shoes: ${v.shoe}`,

    // SCENE
    `location: ${v.loc}`,
    `season context: ${v.season_scene}`,
    `time: ${v.time}`,
    `weather: ${v.weather}`,
    ...(v.noise ? [`environmental detail: ${v.noise}`] : []),

    // CINEMA
    `camera: ${v.camera}`,
    `film style: ${v.styleScene}`,
    ...(v.perception ? [`perception: ${v.perception}`] : []),

    // EMOTION
    `emotional atmosphere: ${v.emotionalNarrative}`,

    // FINAL
    "cinematic everyday America, film photography realism, natural imperfect lighting, subtle grain, authentic atmosphere, high detail"
  ];
  currentPrompt = parts.join(", ");
  document.getElementById("finalPrompt").value = currentPrompt;
  renderFields();
}

function renderFields() {
  const v = lastVals;
  document.getElementById("displayFields").innerHTML = [
    { label: "Style", value: v.style, color: "#f9a8d4", key: "style" },
    { label: "Top", value: v.top, color: "#c084fc", key: "top" },
    { label: "Bottom", value: v.bottom, color: "#c084fc", key: "bottom" },
    { label: "Outer", value: v.outer || "— none —", color: v.outer ? "#93c5fd" : "#2a2535", key: "outer" },
    { label: "Fabric", value: v.fabric, color: "#fcd34d", key: "fabric" },
    { label: "Color", value: v.color, color: "#fcd34d", key: "color" },
    { label: "Accessories", value: v.acc, color: "#86efac", key: "acc" },
    { label: "Shoes", value: v.shoe, color: "#67e8f9", key: "shoe" },
    { label: "Scene", value: v.loc, color: "#fda4af", key: "loc" },
    { label: "Season", value: v.season_scene, color: "#fcd34d", key: "season_scene" },
    { label: "Time", value: v.time, color: "#fcd34d", key: "time" },
    { label: "Weather", value: v.weather, color: "#a5f3fc", key: "weather" },
    { label: "Mood", value: v.mood, color: "#d9f99d", key: "mood" },
    { label: "Camera", value: v.camera, color: "#fed7aa", key: "camera" },
    { label: "Figure", value: v.pose, color: "#c084fc", key: "pose" },
    { label: "Gesture", value: v.gesture, color: "#f9a8d4", key: "gesture" },
    { label: "Expression", value: v.expression, color: "#86efac", key: "expression" },
    { label: "Lighting", value: v.light, color: "#fcd34d", key: "light" },
    { label: "Theme", value: v.theme, color: "#d9f99d", key: "theme" },
    { label: "Narrative", value: v.emotionalNarrative, color: "#c084fc", key: "emotionalNarrative" },
    ...(v.perception ? [{ label: "Perception", value: v.perception, color: "#c084fc", key: "perception", rare: true }] : []),
    ...(v.noise ? [{ label: "Noise", value: v.noise, color: "#fda4af", key: "noise" }] : []),
  ].map(f => `
    <div class="field-row">
      <div class="field-label">${f.label}</div>
      <div class="field-value" style="color:${f.color}">
        ${f.value}${f.rare ? '<span class="rare-badge" style="color:#c084fc">rare</span>' : ''}
      </div>
      <button class="reroll-btn" onclick="reroll('${f.key}')" title="Re-roll">🔄</button>
    </div>
  `).join("");
}

function generateAll() {
  generated++;
  document.getElementById("counter").textContent = `${generated} generated`;
  document.getElementById("emptyState").style.display = "none";
  document.getElementById("displayFields").style.display = "flex";
  document.getElementById("promptBox").style.display = "block";

  const loc = pick(LOCATIONS);
  const time = pick(TIMES);
  let weather = pick(WEATHER[currentSeason]);
  weather = getEnvironmentalWeather(loc, weather);
  const season_scene = pick(SEASONS_SCENE[currentSeason]);
  const mood = pick(MOODS);
  const camera = getOpticalCamera(currentFraming);
  let styleScene = pick(STYLE_SCENE);
  styleScene = getThemedStyleScene(theme, styleScene);
  const perception = Math.random() < 0.38 ? pick(PERCEPTION) : null; // Reduced to 38% for better "rare" feel
  const theme = pick(THEMES);
  const noise = Math.random() < 0.65 ? getContextualNoise(loc) : null;
  const variation = Math.random() < 0.5 ? pick(CORE_VARIATION) : null;
  
  // Build unified emotional narrative (theme + mood + variation)
  const emotionalNarrative = buildEmotionalNarrative(theme, mood, variation);

  // Use contextual bias to reduce field mismatch
  let style = pick(STYLES);
  for (let attempt = 0; attempt < 8; attempt++) {
    const bias = getStyleBias(loc, style);
    if (Math.random() < bias) break;
    style = pick(STYLES);
  }
  
  const isFormalLocation = FORMAL_LOC_KEYWORDS.some(k => loc.includes(k));
  let top;
  if (isFormalLocation && Math.random() < 0.7) {
    top = pick(FORMAL_TOPS);
  } else if (Math.random() < 0.25) {
    top = pick(SEXY_TOPS);
  } else {
    top = pick(TOPS);
  }
  
  const bottom = getContextualBottom(currentSeason, loc);
  const outer = (currentSeason === "summer") ? (Math.random() < 0.25 ? pick(OUTERWEAR.summer) : null) : (Math.random() < 0.55 ? pick(OUTERWEAR[currentSeason]) : null);
  const fabric = pick(FABRICS);
  const color = pick(COLORS[currentSeason]);
  const acc = pickAccessories(loc);
  
  // Light consistency rules for shoes/outer
  let shoe = pick(SHOES);
  if (isFormalLocation) {
    // Prefer heels for formal locations
    const formalShoes = SHOES.filter(s => s.includes("heel") || s.includes("pump") || s.includes("Mary Jane") || s.includes("slingback"));
    if (formalShoes.length > 0 && Math.random() < 0.7) shoe = pick(formalShoes);
  } else if (loc.includes("motorcycle") || loc.includes("bike") || loc.includes("Harley")) {
    const motoShoes = SHOES.filter(s => s.includes("motorcycle") || s.includes("engineer") || s.includes("harness") || s.includes("boot"));
    if (motoShoes.length > 0 && Math.random() < 0.7) shoe = pick(motoShoes);
  } else if (loc.includes("beach") || loc.includes("sand") || loc.includes("ocean")) {
    const beachShoes = SHOES.filter(s => s.includes("sandal") || s.includes("flip") || s.includes("thong"));
    if (beachShoes.length > 0 && Math.random() < 0.6) shoe = pick(beachShoes);
  }

  const framingText = { full: "full body shot", upper: "upper body shot from waist up", bust: "bust shot", close: "extreme close-up on face" }[currentFraming];
  const pose = pick(BODY_POSES);
  const gesture = pick(HAND_GESTURES);
  const expression = pick(FACIAL_EXPRESSIONS);
  const light = getTemporalLighting(time);

  const parts = [
    // SUBJECT
    "subject: young American woman in her early 20s, naturally styled, no heavy makeup",
    `framing: ${framingText}`,
    `pose: ${pose}`,
    `gesture: ${gesture}`,
    `expression: ${expression}`,
    `lighting: ${light}`,

    // LOOK
    `outfit style: ${style}`,
    `top: ${top}`,
    `bottom: ${bottom}`,
    ...(outer ? [`outer: ${outer}`] : []),
    `fabric: ${fabric}`,
    `color palette: ${color}`,
    `accessories: ${acc}`,
    `shoes: ${shoe}`,

    // SCENE
    `location: ${loc}`,
    `season context: ${season_scene}`,
    `time: ${time}`,
    `weather: ${weather}`,
    ...(noise ? [`environmental detail: ${noise}`] : []),

    // CINEMA
    `camera: ${camera}`,
    `film style: ${styleScene}`,
    ...(perception ? [`perception: ${perception}`] : []),

    // EMOTION
    `emotional atmosphere: ${emotionalNarrative}`,

    // FINAL
    "cinematic everyday America, film photography realism, natural imperfect lighting, subtle grain, authentic atmosphere, high detail"
  ];

  // 4. Negative Constraint Enforcement - auto-reroll if invalid
  let retryCount = 0;
  while (hasNegativeConstraint(currentSeason, loc, bottom, outer) && retryCount < 5) {
    bottom = getContextualBottom(currentSeason, loc);
    outer = (currentSeason === "summer") ? (Math.random() < 0.25 ? pick(OUTERWEAR.summer) : null) : (Math.random() < 0.55 ? pick(OUTERWEAR[currentSeason]) : null);
    retryCount++;
  }

  lastVals = { style, top, bottom, outer, fabric, color, acc, shoe, loc, time, weather, season_scene, mood, camera, styleScene, perception, theme, noise, variation, emotionalNarrative, pose, gesture, expression, light };

  currentPrompt = parts.join(", ");
  document.getElementById("finalPrompt").value = currentPrompt;
  renderFields();
  document.getElementById("saveBtn").style.display = "block";
}

function copyPrompt() {
  if (!currentPrompt) return;

  // Most reliable method: use temporary textarea + execCommand
  const textarea = document.createElement("textarea");
  textarea.value = currentPrompt;
  textarea.style.position = "fixed";
  textarea.style.opacity = "0";
  document.body.appendChild(textarea);
  textarea.select();

  try {
    const successful = document.execCommand("copy");
    if (successful) {
      const btn = document.getElementById("copyBtn");
      btn.textContent = "Copied ✓";
      btn.classList.add("copied");
      setTimeout(() => {
        btn.textContent = "Copy Prompt";
        btn.classList.remove("copied");
      }, 2000);
    }
  } catch (err) {
    console.error("Copy failed:", err);
  }

  document.body.removeChild(textarea);
}

function savePrompt() {
  if (!currentPrompt) return;
  let saved = JSON.parse(localStorage.getItem("asa_v1") || "[]");
  if (saved.includes(currentPrompt)) return;
  saved.unshift(currentPrompt);
  localStorage.setItem("asa_v1", JSON.stringify(saved.slice(0, 30)));
  renderSaved();
}

function renderSaved() {
  const saved = JSON.parse(localStorage.getItem("asa_v1") || "[]");
  const section = document.getElementById("savedSection");
  const list = document.getElementById("savedList");
  if (saved.length === 0) { section.style.display = "none"; return; }
  section.style.display = "block";
  list.innerHTML = saved.map((p, i) => `<div class="saved-item" data-index="${i}">${p}</div>`).join("");
  document.querySelectorAll(".saved-item").forEach(el => {
    el.onclick = () => {
      const promptText = saved[el.dataset.index];
      navigator.clipboard.writeText(promptText);
      currentPrompt = promptText;
      document.getElementById("finalPrompt").value = currentPrompt;
    };
  });
}

renderSaved();
</script>
